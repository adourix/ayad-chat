name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: node --check web/public/sw.js
      - run: node -e "JSON.parse(require('fs').readFileSync('web/public/manifest.webmanifest'))"
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build Docker image
        run: docker build -t duet:ci .
      - name: Run Docker smoke test
        run: |
          mkdir -p /tmp/duet-smoke-data
          sudo chown 10001:10001 /tmp/duet-smoke-data
          docker run -d --name duet-smoke -p 127.0.0.1:3000:3000 -v /tmp/duet-smoke-data:/data -e NODE_ENV=production -e HOST=0.0.0.0 -e DATABASE_PATH=/data/duet.db -e ALLOWED_ORIGINS=http://127.0.0.1:3000 -e SESSION_COOKIE_NAME=duet_session duet:ci
          trap 'docker logs duet-smoke || true; docker rm -f duet-smoke || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ -o /tmp/duet-index.html
          grep -q 'amffff' /tmp/duet-index.html
